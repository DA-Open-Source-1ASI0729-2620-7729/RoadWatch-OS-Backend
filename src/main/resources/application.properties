spring.application.name=RoadWatch OS Backend
spring.profiles.default=dev
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.naming.physical-strategy=com.vianexo.roadwatch.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
documentation.application.description=@project.description@
documentation.application.version=@project.version@
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
incident-mitigation.overdue-check.fixed-delay=PT24H
incident-mitigation.overdue-check.max-open-days=7
incident-mitigation.overdue-check.changed-by-user-id=1

app.storage.upload-dir=uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
